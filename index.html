<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLync — 與 KOL 同步的關係智慧</title>
<meta name="description" content="為醫學聯絡人 (MSL) 打造的 KOL 關係管理工具 · 聯繫節奏智慧、擁護度追蹤、拜訪前簡報。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#EAF0EE;
    --surface:#FFFFFF;
    --surface-2:#F4F8F6;
    --ink:#14211F;
    --muted:#5C6E6A;
    --faint:#8A9B97;
    --pine:#0F4A43;
    --pine-600:#136055;
    --pine-tint:#E1EEEA;
    --advocate:#2E9E7B;
    --advocate-tint:#DFF1EA;
    --neutral:#B8842A;
    --neutral-tint:#F5EAD6;
    --skeptic:#BC5245;
    --skeptic-tint:#F6E1DD;
    --hair:#D6E0DD;
    --hair-strong:#C3D1CD;
    --shadow:0 1px 2px rgba(20,33,31,.04), 0 8px 24px rgba(20,33,31,.06);
    --shadow-lg:0 4px 12px rgba(20,33,31,.08), 0 24px 60px rgba(20,33,31,.14);
    --r:14px;
    --r-sm:10px;
    --sans:"Inter","Noto Sans TC",system-ui,sans-serif;
    --display:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    background:var(--canvas);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.005em;
  }
  ::selection{background:var(--pine);color:#fff}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .tnum{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ---------- Shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

  .sidebar{
    background:var(--pine);
    color:#DCEAE6;
    padding:22px 16px;
    display:flex;flex-direction:column;gap:6px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(150deg,#3AA588,#0F4A43);
    display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .brand-mark svg{width:20px;height:20px}
  .brand-name{font-family:var(--display);font-weight:700;font-size:16px;color:#fff;letter-spacing:-.02em;line-height:1.1}
  .brand-sub{font-size:10.5px;color:#8FBAB0;letter-spacing:.02em;margin-top:2px}
  .nav-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#6FA197;padding:14px 8px 6px;font-weight:600}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:9px 10px;border-radius:9px;
    font-size:13.5px;font-weight:500;color:#BFD8D2;
    transition:background .15s,color .15s;width:100%;text-align:left;
  }
  .nav-item svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.13);color:#fff}
  .nav-item.active svg{opacity:1}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
  .btn-reset{
    display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;
    font-size:12px;color:#9EC3BB;transition:background .15s,color .15s;
  }
  .btn-reset:hover{background:rgba(255,255,255,.07);color:#fff}
  .btn-reset svg{width:14px;height:14px}
  .demo-chip{
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7FAEA5;
    margin-top:10px;padding:0 10px;
  }

  /* ---------- Main ---------- */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:20px 34px;background:var(--canvas);
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid transparent;transition:border-color .2s,background .2s;
  }
  .topbar.scrolled{background:rgba(234,240,238,.85);backdrop-filter:blur(10px);border-color:var(--hair)}
  .page-title{font-size:21px}
  .page-sub{font-size:12.5px;color:var(--muted);margin-top:1px;font-weight:400}
  .topbar-spacer{flex:1}
  .search{position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:12px;width:15px;height:15px;color:var(--faint)}
  .search input{
    width:220px;padding:9px 12px 9px 34px;border-radius:10px;
    border:1px solid var(--hair);background:var(--surface);font-size:13px;
    transition:border-color .15s,box-shadow .15s,width .2s;
  }
  .search input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-tint);width:260px}
  .btn-primary{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:10px;background:var(--pine);color:#fff;
    font-size:13px;font-weight:600;box-shadow:var(--shadow);
    transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap;
  }
  .btn-primary:hover{background:var(--pine-600);box-shadow:var(--shadow-lg)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary svg{width:15px;height:15px}

  .content{padding:8px 34px 60px;max-width:1180px;width:100%}
  .view{display:none;animation:fade .35s ease both}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Stat cards ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .stat{
    background:var(--surface);border-radius:var(--r);padding:17px 18px;
    box-shadow:var(--shadow);border:1px solid var(--hair);position:relative;overflow:hidden;
  }
  .stat-label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  .stat-label svg{width:14px;height:14px;color:var(--faint)}
  .stat-value{font-family:var(--display);font-size:31px;font-weight:600;margin-top:8px;line-height:1;letter-spacing:-.02em}
  .stat-value small{font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
  .stat-meta{font-size:11.5px;margin-top:7px;color:var(--faint);font-weight:450}
  .stat-meta b{color:var(--advocate);font-weight:600}
  .stat-meta.warn b{color:var(--skeptic)}

  /* ---------- Section ---------- */
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  .panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--hair);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
  .panel-head h3{font-size:14.5px}
  .panel-head .eyebrow{font-size:11px;color:var(--muted);font-weight:450;margin-top:2px}
  .badge-count{font-size:11.5px;font-weight:600;color:var(--pine);background:var(--pine-tint);padding:3px 9px;border-radius:20px;font-family:var(--display)}

  /* cadence suggestion list */
  .cue{
    display:flex;align-items:center;gap:13px;padding:12px 18px;
    border-top:1px solid var(--hair);transition:background .12s;cursor:pointer;
  }
  .cue:hover{background:var(--surface-2)}
  .avatar{
    width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    font-family:var(--display);font-weight:600;font-size:14px;color:#fff;letter-spacing:0;
  }
  .cue-body{flex:1;min-width:0}
  .cue-name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .cue-sub{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cue-status{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;font-family:var(--display)}
  .st-over{background:var(--skeptic-tint);color:var(--skeptic)}
  .st-due{background:var(--neutral-tint);color:var(--neutral)}
  .st-ok{background:var(--advocate-tint);color:var(--advocate)}

  /* activity feed */
  .feed-item{display:flex;gap:12px;padding:13px 18px;border-top:1px solid var(--hair)}
  .feed-dot{
    width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:var(--surface-2);color:var(--pine);
  }
  .feed-dot svg{width:15px;height:15px}
  .feed-body{flex:1;min-width:0}
  .feed-text{font-size:12.5px;line-height:1.5}
  .feed-text b{font-weight:600}
  .feed-time{font-size:11px;color:var(--faint);margin-top:2px}

  /* ---------- Cadence pulse (signature) ---------- */
  .pulse{display:flex;align-items:center;gap:9px}
  .pulse-track{flex:1;height:22px;position:relative;min-width:64px}
  .pulse-svg{display:block;width:100%;height:100%;overflow:visible}
  .pulse-caption{font-size:10.5px;font-weight:600;color:var(--faint);font-family:var(--display);white-space:nowrap}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.9);opacity:.35}}
  .pulse-dot{transform-origin:center;transform-box:fill-box}
  @media (prefers-reduced-motion:no-preference){.pulse-dot.live{animation:beat 1.8s ease-in-out infinite}}

  /* ---------- KOL directory ---------- */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{
    padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:500;
    background:var(--surface);border:1px solid var(--hair);color:var(--muted);transition:all .14s;
  }
  .chip:hover{border-color:var(--hair-strong);color:var(--ink)}
  .chip.active{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
  .chip .n{opacity:.6;font-family:var(--display);margin-left:3px}
  .chip.active .n{opacity:.75}

  .kol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .kol-card{
    background:var(--surface);border-radius:var(--r);border:1px solid var(--hair);
    box-shadow:var(--shadow);padding:18px;cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;
  }
  .kol-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--hair-strong)}
  .kc-top{display:flex;gap:12px;align-items:flex-start}
  .kc-id{flex:1;min-width:0}
  .kc-name{font-size:15px;font-weight:600;font-family:var(--display)}
  .kc-role{font-size:12px;color:var(--muted);margin-top:2px}
  .kc-org{font-size:11.5px;color:var(--faint);margin-top:1px;display:flex;align-items:center;gap:4px}
  .kc-org svg{width:12px;height:12px}
  .tier{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;font-family:var(--display)}
  .tier-advocate{background:var(--advocate-tint);color:var(--advocate)}
  .tier-neutral{background:var(--neutral-tint);color:var(--neutral)}
  .tier-skeptic{background:var(--skeptic-tint);color:var(--skeptic)}
  .kc-pulse{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
  .kc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
  .tag{font-size:10.5px;color:var(--muted);background:var(--surface-2);padding:3px 8px;border-radius:6px}

  /* ---------- Detail drawer ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(20,33,31,.42);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
  }
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);
    background:var(--canvas);z-index:50;box-shadow:var(--shadow-lg);
    transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:none}
  .drawer-head{
    padding:22px 24px 18px;background:var(--pine);color:#fff;position:relative;
  }
  .drawer-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#CFE3DE;transition:background .15s,color .15s}
  .drawer-close:hover{background:rgba(255,255,255,.14);color:#fff}
  .drawer-close svg{width:18px;height:18px}
  .dh-top{display:flex;gap:14px;align-items:center}
  .dh-name{font-size:20px;color:#fff;font-family:var(--display);font-weight:600}
  .dh-role{font-size:13px;color:#B7D4CD;margin-top:3px}
  .dh-tier{margin-top:12px;display:inline-flex}
  .dh-tier .tier{background:rgba(255,255,255,.16);color:#fff}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 24px 40px}

  .d-sect{margin-bottom:22px}
  .d-sect-h{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .d-sect-h svg{width:14px;height:14px;color:var(--faint)}

  .brief{
    background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--pine);
    border-radius:var(--r-sm);padding:15px 16px;font-size:13px;line-height:1.65;color:var(--ink);
    box-shadow:var(--shadow);
  }
  .brief b{font-weight:600;color:var(--pine)}

  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .meta-cell{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-sm);padding:12px 13px}
  .meta-k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .meta-v{font-size:14px;font-weight:600;font-family:var(--display);margin-top:5px}
  .meta-v small{font-size:11px;color:var(--muted);font-weight:400;font-family:var(--sans)}

  /* attitude trend */
  .trend-wrap{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-sm);padding:16px;box-shadow:var(--shadow)}
  .trend-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .trend-score{font-family:var(--display);font-size:26px;font-weight:600}
  .trend-delta{font-size:12px;font-weight:600}
  .trend-delta.up{color:var(--advocate)}
  .trend-delta.down{color:var(--skeptic)}
  .trend-delta.flat{color:var(--faint)}

  /* timeline */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--hair-strong)}
  .tl-item{position:relative;padding-bottom:18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-node{position:absolute;left:-26px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--pine);display:grid;place-items:center}
  .tl-node svg{width:9px;height:9px;color:var(--pine)}
  .tl-card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-sm);padding:11px 13px;box-shadow:var(--shadow)}
  .tl-meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .tl-type{font-size:10.5px;font-weight:600;color:var(--pine);background:var(--pine-tint);padding:2px 7px;border-radius:5px}
  .tl-date{font-size:11px;color:var(--faint);font-family:var(--display)}
  .tl-text{font-size:12.5px;line-height:1.55;color:var(--ink)}

  /* ---------- Modal (add interaction) ---------- */
  .modal-scrim{position:fixed;inset:0;background:rgba(20,33,31,.42);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
  .modal-scrim.open{opacity:1;pointer-events:auto}
  .modal{background:var(--surface);border-radius:18px;width:min(460px,100%);box-shadow:var(--shadow-lg);transform:scale(.96);transition:transform .22s;overflow:hidden}
  .modal-scrim.open .modal{transform:none}
  .modal-head{padding:20px 22px 4px}
  .modal-head h3{font-size:17px}
  .modal-head p{font-size:12.5px;color:var(--muted);margin-top:3px}
  .modal-body{padding:16px 22px 22px;display:flex;flex-direction:column;gap:14px}
  .field label{font-size:12px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--hair);
    background:var(--surface-2);font-size:13px;transition:border-color .15s,box-shadow .15s;
  }
  .field textarea{resize:vertical;min-height:74px;line-height:1.5}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-tint);background:var(--surface)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .att-seg{display:flex;gap:6px}
  .att-opt{flex:1;padding:9px 6px;border-radius:9px;border:1px solid var(--hair);background:var(--surface-2);font-size:12px;font-weight:500;text-align:center;transition:all .14s;color:var(--muted)}
  .att-opt[data-sel="advocate"].on{background:var(--advocate-tint);border-color:var(--advocate);color:var(--advocate);font-weight:600}
  .att-opt[data-sel="neutral"].on{background:var(--neutral-tint);border-color:var(--neutral);color:var(--neutral);font-weight:600}
  .att-opt[data-sel="skeptic"].on{background:var(--skeptic-tint);border-color:var(--skeptic);color:var(--skeptic);font-weight:600}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 22px}
  .btn-ghost{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--hair);transition:all .14s}
  .btn-ghost:hover{background:var(--canvas);color:var(--ink)}

  /* empty */
  .empty{text-align:center;padding:56px 20px;color:var(--faint)}
  .empty svg{width:38px;height:38px;margin-bottom:12px;opacity:.5}
  .empty p{font-size:13px}

  /* mobile menu button */
  .menu-btn{display:none;width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--hair);place-items:center}
  .menu-btn svg{width:19px;height:19px}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s;z-index:80;display:flex;align-items:center;gap:9px}
  .toast svg{width:16px;height:16px;color:var(--advocate)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Disclaimer ---------- */
  .disclaimer{
    margin-top:30px;padding:16px 18px;
    background:var(--surface);border:1px solid var(--hair);
    border-radius:var(--r);box-shadow:var(--shadow);
    display:flex;gap:13px;align-items:flex-start;
  }
  .disc-ic{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--pine-tint);color:var(--pine)}
  .disc-ic svg{width:17px;height:17px}
  .disc-body{font-size:12px;line-height:1.6;color:var(--muted)}
  .disc-body strong{display:block;font-size:12.5px;color:var(--ink);font-weight:600;margin-bottom:3px;font-family:var(--display);letter-spacing:-.01em}

  /* ---------- Responsive ---------- */
  @media(max-width:1080px){.stat-grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:transform .28s;width:236px}
    .sidebar.open{transform:none}
    .menu-btn{display:grid}
    .topbar{padding:16px 18px}
    .content{padding:8px 18px 60px}
    .search input{width:150px}
    .search input:focus{width:170px}
    .page-sub{display:none}
  }
  @media(max-width:520px){
    .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
    .stat-value{font-size:26px}
    .search{display:none}
    .kol-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h3.5l2-6 3.5 12 3-9 2 3H21" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
/* ============================================================
   KOLync — 純前端示範工具
   資料儲存於瀏覽器 localStorage，可離線運作、無需後端。
   ============================================================ */
const DAY = 86400000;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((b-a)/DAY);
const fmtDate = s => { const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };

const TIER = {
  advocate:{label:'擁護者',cls:'advocate'},
  neutral :{label:'中立',  cls:'neutral'},
  skeptic :{label:'存疑',  cls:'skeptic'}
};
const scoreToTier = s => s>=67?'advocate': s>=34?'neutral':'skeptic';
const AV_COLORS = {advocate:'#2E9E7B',neutral:'#B8842A',skeptic:'#BC5245'};

/* ---- 示範資料種子 (相對於今天計算，永遠看起來是最新的) ---- */
function seed(){
  const t = today();
  const at = daysAgo => iso(new Date(t.getTime() - daysAgo*DAY));
  const raw = [
    {n:'林醫師',role:'消化內科 主治醫師',org:'臺大醫院',cad:30,score:88,tags:['IBD 臨床試驗','生物製劑','發炎性腸道疾病'],
     inter:[
      {d:12,ty:'面訪',x:'回顧最新 UC 生物製劑實證，醫師對維持期數據高度肯定，願擔任院內個案分享講者。',a:90},
      {d:44,ty:'學術活動',x:'區域 IBD 論壇會後交流，討論真實世界資料需求。',a:85},
      {d:78,ty:'線上會議',x:'首次深度會談，確認其臨床研究方向與合作意願。',a:80},
     ]},
    {n:'陳醫師',role:'消化內科 主治醫師',org:'臺北榮民總醫院',cad:45,score:52,tags:['腸道菌相','營養照護'],
     inter:[
      {d:51,ty:'電話',x:'簡短更新產品安全性資料，醫師關注長期用藥追蹤數據。',a:52},
      {d:96,ty:'面訪',x:'初次拜訪，態度中性，要求提供更完整的頭對頭比較。',a:48},
     ]},
    {n:'黃醫師',role:'大腸直腸外科 主任',org:'林口長庚紀念醫院',cad:30,score:82,tags:['術後照護','跨科整合','手術決策'],
     inter:[
      {d:5,ty:'面訪',x:'討論術後銜接內科治療之照護路徑，醫師主動提出共同撰寫個案報告。',a:84},
      {d:33,ty:'線上會議',x:'分享外科觀點的疾病管理流程，反應正面。',a:80},
      {d:70,ty:'訊息',x:'轉寄近期回顧文獻，醫師表達感謝。',a:78},
     ]},
    {n:'吳醫師',role:'消化內科 主治醫師',org:'高雄醫學大學附設中和紀念醫院',cad:60,score:28,tags:['健保給付','成本效益'],
     inter:[
      {d:68,ty:'面訪',x:'醫師對給付條件與成本效益仍有疑慮，需補充本土藥物經濟學資料。',a:28},
      {d:132,ty:'學術活動',x:'研討會偶遇，簡短寒暄，尚未建立實質互動。',a:32},
     ]},
    {n:'張醫師',role:'消化內科 主治醫師',org:'中國醫藥大學附設醫院',cad:45,score:60,tags:['青年醫師','衛教推廣'],
     inter:[
      {d:20,ty:'線上會議',x:'介紹病友衛教素材，醫師有意於門診導入並提供回饋。',a:62},
      {d:58,ty:'面訪',x:'建立初步關係，了解其門診族群與需求。',a:55},
     ]},
    {n:'李醫師',role:'消化內科 科主任',org:'國立成功大學醫學院附設醫院',cad:30,score:78,tags:['指引制定','意見領袖','南區樞紐'],
     inter:[
      {d:33,ty:'面訪',x:'共識指引更新討論，醫師願協助引薦南區其他 KOL。',a:80},
      {d:64,ty:'學術活動',x:'擔任座長，會後肯定產品在臨床定位的實證強度。',a:76},
      {d:95,ty:'線上會議',x:'交流指引草案架構與時程。',a:74},
     ]},
    {n:'王醫師',role:'風濕免疫科 主治醫師',org:'臺中榮民總醫院',cad:45,score:56,tags:['跨適應症','免疫調節'],
     inter:[
      {d:40,ty:'面訪',x:'探討跨適應症應用潛力，醫師感興趣但希望看到更多長期安全性。',a:56},
      {d:88,ty:'訊息',x:'分享跨科臨床應用文獻。',a:52},
     ]},
    {n:'蔡醫師',role:'消化內科 主治醫師',org:'三軍總醫院',cad:60,score:30,tags:['實證嚴謹','學術導向'],
     inter:[
      {d:15,ty:'線上會議',x:'醫師對現有試驗設計提出方法學質疑，需安排醫學顧問深入討論。',a:30},
      {d:74,ty:'面訪',x:'初次接觸，態度保留，重視獨立臨床證據。',a:34},
     ]},
  ];
  return raw.map((k,i)=>({
    id:'k'+(i+1),
    name:k.n, role:k.role, org:k.org, cadence:k.cad, tags:k.tags,
    interactions:k.inter.map(x=>({date:at(x.d),type:x.ty,note:x.x,score:x.a}))
                        .sort((a,b)=>a.date<b.date?1:-1)
  }));
}

/* ---- 狀態 ---- */
const SEED_VERSION = 2;   // 示範資料每次更新就 +1，使用者一開啟即自動刷新
let DATA = load();
let curFilter='all', curSearch='', curView='dashboard', curKol=null, curAtt='neutral';

function load(){
  try{
    const s=localStorage.getItem('kolync');
    if(s){ const p=JSON.parse(s); if(p && p.v===SEED_VERSION && Array.isArray(p.data)) return p.data; }
  }catch(e){}
  const d=seed(); save(d); return d;   // 無資料或版本過舊 → 重新載入示範資料
}
function save(d){ localStorage.setItem('kolync', JSON.stringify({v:SEED_VERSION, data:(d||DATA)})); }

/* ---- 衍生計算 ---- */
function latestScore(k){ return k.interactions.length? k.interactions[0].score : 50; }
function lastContact(k){ return k.interactions.length? k.interactions[0].date : null; }
function daysSince(k){ const lc=lastContact(k); return lc? daysBetween(new Date(lc),today()):999; }
function cadenceState(k){
  const ratio = daysSince(k)/k.cadence;
  const over = daysSince(k)-k.cadence;
  if(ratio>=1)   return {key:'over', ratio, label:`逾期 ${over} 天`,   cls:'st-over'};
  if(ratio>=0.75)return {key:'due',  ratio, label:`${k.cadence-daysSince(k)} 天後到期`, cls:'st-due'};
  return {key:'ok', ratio, label:'節奏良好', cls:'st-ok'};
}
function initials(name){ const s=name.replace(/醫師$/,''); return s.slice(0,2)||name.slice(0,1); }
function avatarColor(k){ return AV_COLORS[scoreToTier(latestScore(k))]; }

/* ============================================================
   渲染
   ============================================================ */
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

/* 招牌元件：關係節奏脈搏 */
function pulseSVG(k){
  const st = cadenceState(k);
  const ratio = Math.min(st.ratio,1.35);
  const col = st.key==='over'?'var(--skeptic)': st.key==='due'?'var(--neutral)':'var(--advocate)';
  const W=100, cx=Math.min(ratio,1)*W;
  // heartbeat path scaled to the "filled" portion
  const flat1=`M0 11 L${cx*0.42} 11`;
  const spike=`L${cx*0.5} 3 L${cx*0.58} 19 L${cx*0.66} 11`;
  const flat2=`L${W} 11`;
  const live = st.key!=='ok' ? 'live' : '';
  return `<svg class="pulse-svg" viewBox="0 0 ${W} 22" preserveAspectRatio="none">
    <line x1="0" y1="11" x2="${W}" y2="11" stroke="var(--hair-strong)" stroke-width="1.5" stroke-dasharray="2 3"/>
    <path d="${flat1} ${cx>10?spike:''} ${flat2}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <circle class="pulse-dot ${live}" cx="${Math.min(cx,W)}" cy="11" r="3.5" fill="${col}"/>
  </svg>`;
}
function pulseRow(k){
  const st=cadenceState(k);
  return `<div class="pulse">
    <div class="pulse-track">${pulseSVG(k)}</div>
    <span class="pulse-caption">${daysSince(k)===999?'尚未聯繫':daysSince(k)+' 天前'} · 每 ${k.cadence} 天</span>
  </div>`;
}

/* ---- 儀表板 ---- */
function renderDashboard(){
  const total=DATA.length;
  const needs=DATA.filter(k=>cadenceState(k).key!=='ok').length;
  const week=DATA.reduce((n,k)=>n+k.interactions.filter(i=>daysBetween(new Date(i.date),today())<=7).length,0);
  const avg=Math.round(DATA.reduce((s,k)=>s+latestScore(k),0)/total);
  const advocates=DATA.filter(k=>scoreToTier(latestScore(k))==='advocate').length;

  $('#statGrid').innerHTML = [
    {ic:'<circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 19c0-3 2-4.5 5-4.5s5 1.5 5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 5a2.5 2.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
     l:'KOL 總數',v:total,m:`<b>${advocates}</b> 位擁護者`},
    {ic:'<path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>',
     l:'待聯繫',v:needs,m:`需在本週安排接觸`,warn:needs>0},
    {ic:'<path d="M4 12h4l2-5 4 10 2-5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
     l:'近 7 天互動',v:week,m:'已記錄的接觸次數'},
    {ic:'<path d="M12 3l2.4 5 5.6.6-4.2 3.8 1.2 5.6L12 16.8 6.9 20l1.2-5.6L4 10.6 9.6 10z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
     l:'平均擁護度',v:avg,suf:'<small>/100</small>',m:'整體關係健康分數'},
  ].map(s=>`<div class="stat">
      <div class="stat-label"><svg viewBox="0 0 24 24" fill="none">${s.ic}</svg>${s.l}</div>
      <div class="stat-value tnum">${s.v}${s.suf||''}</div>
      <div class="stat-meta ${s.warn?'warn':''}">${s.m}</div>
    </div>`).join('');

  // cadence suggestions: 逾期 + 即將到期，逾期優先、逾期天數多者優先
  const cues = DATA.filter(k=>cadenceState(k).key!=='ok')
    .sort((a,b)=> cadenceState(b).ratio - cadenceState(a).ratio);
  $('#cueCount').textContent = cues.length;
  $('#cueList').innerHTML = cues.length? cues.map(k=>{
    const st=cadenceState(k), tier=TIER[scoreToTier(latestScore(k))];
    return `<div class="cue" data-kol="${k.id}">
      <div class="avatar" style="background:${avatarColor(k)}">${initials(k.name)}</div>
      <div class="cue-body">
        <div class="cue-name">${k.name}<span class="tier tier-${tier.cls}" style="font-size:9.5px;padding:2px 7px">${tier.label}</span></div>
        <div class="cue-sub">${k.role} · ${k.org}</div>
      </div>
      <span class="cue-status ${st.cls}">${st.label}</span>
    </div>`;
  }).join('') : emptyBlock('所有 KOL 都在目標節奏內 — 做得好！');

  // activity feed
  const feed=[];
  DATA.forEach(k=>k.interactions.forEach(i=>feed.push({...i,name:k.name,id:k.id})));
  feed.sort((a,b)=>a.date<b.date?1:-1);
  const TYIC={'面訪':'<path d="M4 6h16v10H4z" stroke="currentColor" stroke-width="1.7"/><path d="M8 20h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    '線上會議':'<rect x="3" y="6" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M15 10l6-3v10l-6-3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
    '電話':'<path d="M5 4h4l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5V19a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
    '學術活動':'<path d="M12 4 3 8l9 4 9-4-9-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 11v4c0 1 2.2 2.5 5 2.5s5-1.5 5-2.5v-4" stroke="currentColor" stroke-width="1.6"/>',
    '訊息':'<path d="M4 5h16v11H9l-4 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>'};
  $('#feedList').innerHTML = feed.slice(0,7).map(i=>`
    <div class="feed-item" data-kol="${i.id}" style="cursor:pointer">
      <div class="feed-dot"><svg viewBox="0 0 24 24" fill="none">${TYIC[i.type]||TYIC['訊息']}</svg></div>
      <div class="feed-body">
        <div class="feed-text"><b>${i.name}</b> · ${i.type}</div>
        <div class="feed-time">${fmtDate(i.date)} · ${daysBetween(new Date(i.date),today())} 天前</div>
      </div>
    </div>`).join('');
}
function emptyBlock(msg){
  return `<div class="empty"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M8 12l3 3 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><p>${msg}</p></div>`;
}

/* ---- KOL 名錄 ---- */
function renderDirectory(){
  const counts={all:DATA.length,advocate:0,neutral:0,skeptic:0,needs:0};
  DATA.forEach(k=>{counts[scoreToTier(latestScore(k))]++; if(cadenceState(k).key!=='ok')counts.needs++;});
  const defs=[['all','全部'],['advocate','擁護者'],['neutral','中立'],['skeptic','存疑'],['needs','需聯繫']];
  $('#filters').innerHTML = defs.map(([k,l])=>`<button class="chip ${curFilter===k?'active':''}" data-f="${k}">${l}<span class="n">${counts[k]}</span></button>`).join('');

  let list=DATA.slice();
  if(curFilter==='needs') list=list.filter(k=>cadenceState(k).key!=='ok');
  else if(curFilter!=='all') list=list.filter(k=>scoreToTier(latestScore(k))===curFilter);
  if(curSearch){ const q=curSearch.toLowerCase();
    list=list.filter(k=>(k.name+k.role+k.org+k.tags.join('')).toLowerCase().includes(q)); }

  // sort: 逾期優先
  list.sort((a,b)=>cadenceState(b).ratio-cadenceState(a).ratio);

  $('#kolGrid').innerHTML = list.length? list.map(k=>{
    const tier=TIER[scoreToTier(latestScore(k))];
    return `<div class="kol-card" data-kol="${k.id}">
      <div class="kc-top">
        <div class="avatar" style="background:${avatarColor(k)}">${initials(k.name)}</div>
        <div class="kc-id">
          <div class="kc-name">${k.name}</div>
          <div class="kc-role">${k.role}</div>
          <div class="kc-org"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V8l8-4 8 4v12" stroke="currentColor" stroke-width="1.6"/><path d="M9 20v-5h6v5" stroke="currentColor" stroke-width="1.6"/></svg>${k.org}</div>
        </div>
        <span class="tier tier-${tier.cls}">${tier.label}</span>
      </div>
      <div class="kc-tags">${k.tags.slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="kc-pulse">${pulseRow(k)}</div>
    </div>`;
  }).join('') : `<div style="grid-column:1/-1">${emptyBlock('找不到符合條件的 KOL')}</div>`;
}

/* ---- 詳情抽屜（含拜訪前簡報） ---- */
function preVisitBrief(k){
  const tier=TIER[scoreToTier(latestScore(k))].label;
  const st=cadenceState(k);
  const last=k.interactions[0];
  const trend = trendDelta(k);
  const cadenceLine = st.key==='over'
    ? `目前<b>${st.label}</b>，建議儘速安排接觸。`
    : st.key==='due' ? `距目標節奏僅剩 ${k.cadence-daysSince(k)} 天，可主動預約。`
    : `聯繫節奏維持良好。`;
  const trendLine = trend.dir==='up'?'近期態度正向上升。': trend.dir==='down'?'近期態度轉趨保留，需留意。':'態度大致持平。';
  const focus = k.tags.length? `其關注領域包含<b>${k.tags.slice(0,2).join('、')}</b>。` : '';
  return `${k.name}目前為<b>${tier}</b>，${cadenceLine}${trendLine}${focus}
  上次於 ${fmtDate(last.date)} 以「${last.type}」接觸：${last.note}`;
}
function trendDelta(k){
  const ints=k.interactions.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(ints.length<2) return {dir:'flat',val:0};
  const d=ints[ints.length-1].score-ints[0].score;
  return {dir:d>3?'up':d<-3?'down':'flat',val:d};
}
function trendSVG(k){
  const ints=k.interactions.slice().sort((a,b)=>a.date<b.date?-1:1);
  const pts=ints.map(i=>i.score);
  if(pts.length===1)pts.unshift(pts[0]);
  const W=220,H=54,pad=4;
  const max=100,min=0;
  const step=(W-pad*2)/(pts.length-1);
  const coords=pts.map((p,i)=>[pad+i*step, pad+(1-(p-min)/(max-min))*(H-pad*2)]);
  const line=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L${coords[coords.length-1][0].toFixed(1)} ${H} L${coords[0][0].toFixed(1)} ${H} Z`;
  const last=coords[coords.length-1];
  const col=AV_COLORS[scoreToTier(latestScore(k))];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
    <defs><linearGradient id="g${k.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g${k.id})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${col}"/>
  </svg>`;
}
function openDrawer(id){
  const k=DATA.find(x=>x.id===id); if(!k)return; curKol=id;
  const tier=TIER[scoreToTier(latestScore(k))];
  const st=cadenceState(k), trend=trendDelta(k);
  const TYIC={'面訪':'<rect x="4" y="6" width="16" height="10" rx="1" stroke="currentColor" stroke-width="1.5"/>',
    '線上會議':'<rect x="3" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M13 11l6-3v8l-6-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
    '電話':'<path d="M6 5h3l1 3-1.5 1a9 9 0 0 0 5 5l1-1.5 3 1v3a2 2 0 0 1-2 2A13 13 0 0 1 4 7a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.4"/>',
    '學術活動':'<path d="M12 5 4 8l8 3 8-3-8-3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    '訊息':'<path d="M5 6h14v9H9l-4 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>'};

  $('#drawer').innerHTML = `
    <div class="drawer-head">
      <button class="drawer-close" id="drawerClose"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="dh-top">
        <div class="avatar" style="width:52px;height:52px;border-radius:14px;font-size:19px;background:${avatarColor(k)};box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)">${initials(k.name)}</div>
        <div>
          <div class="dh-name">${k.name}</div>
          <div class="dh-role">${k.role} · ${k.org}</div>
        </div>
      </div>
      <div class="dh-tier"><span class="tier">${tier.label} · 擁護度 ${latestScore(k)}</span></div>
    </div>
    <div class="drawer-body">
      <div class="d-sect">
        <div class="d-sect-h"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H9l-4 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>拜訪前簡報</div>
        <div class="brief">${preVisitBrief(k)}</div>
      </div>

      <div class="d-sect">
        <div class="meta-grid">
          <div class="meta-cell"><div class="meta-k">聯繫節奏</div><div class="meta-v">每 ${k.cadence} 天 <small>· ${st.label}</small></div></div>
          <div class="meta-cell"><div class="meta-k">上次聯繫</div><div class="meta-v">${daysSince(k)} 天前 <small>${fmtDate(lastContact(k))}</small></div></div>
        </div>
      </div>

      <div class="d-sect">
        <div class="d-sect-h"><svg viewBox="0 0 24 24" fill="none"><path d="M4 16l5-5 3 3 6-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>擁護度趨勢</div>
        <div class="trend-wrap">
          <div class="trend-top">
            <div class="trend-score" style="color:${avatarColor(k)}">${latestScore(k)}<span style="font-size:13px;color:var(--faint)">/100</span></div>
            <div class="trend-delta ${trend.dir}">${trend.dir==='up'?'▲ +'+trend.val:trend.dir==='down'?'▼ '+trend.val:'● 持平'}</div>
          </div>
          ${trendSVG(k)}
        </div>
      </div>

      <div class="d-sect">
        <div class="d-sect-h"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>互動時間軸 · ${k.interactions.length} 筆</div>
        <div class="timeline">
          ${k.interactions.map(i=>`
            <div class="tl-item">
              <div class="tl-node"><svg viewBox="0 0 24 24" fill="none">${TYIC[i.type]||TYIC['訊息']}</svg></div>
              <div class="tl-card">
                <div class="tl-meta"><span class="tl-type">${i.type}</span><span class="tl-date">${fmtDate(i.date)} · ${daysBetween(new Date(i.date),today())} 天前</span></div>
                <div class="tl-text">${i.note}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>

      <button class="btn-primary" style="width:100%;justify-content:center" onclick="openModal('${k.id}')">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        為 ${k.name} 記錄互動
      </button>
    </div>`;
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden','false');
  $('#scrim').classList.add('open');
  $('#drawerClose').onclick=closeDrawer;
}
function closeDrawer(){
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden','true');
  $('#scrim').classList.remove('open');
  curKol=null;
}

/* ---- 記錄互動 Modal ---- */
function openModal(preId){
  $('#mKol').innerHTML=DATA.map(k=>`<option value="${k.id}" ${k.id===preId?'selected':''}>${k.name} · ${k.role}</option>`).join('');
  $('#mDate').value=iso(today());
  $('#mType').selectedIndex=0;
  $('#mNote').value='';
  setAtt('neutral');
  $('#modalScrim').classList.add('open');
  setTimeout(()=>$('#mNote').focus(),250);
}
function closeModal(){ $('#modalScrim').classList.remove('open'); }
function setAtt(v){ curAtt=v; document.querySelectorAll('.att-opt').forEach(b=>b.classList.toggle('on',b.dataset.sel===v)); }
function saveInteraction(){
  const id=$('#mKol').value, k=DATA.find(x=>x.id===id);
  const note=$('#mNote').value.trim()||'（未填寫摘要）';
  const scoreMap={skeptic:28,neutral:55,advocate:82};
  k.interactions.unshift({date:$('#mDate').value,type:$('#mType').value,note,score:scoreMap[curAtt]});
  k.interactions.sort((a,b)=>a.date<b.date?1:-1);
  save();
  closeModal();
  render();
  if(curKol===id && $('#drawer').classList.contains('open')) openDrawer(id);
  toast(`已記錄與 ${k.name} 的互動`);
}

/* ---- toast ---- */
let toastTimer;
function toast(msg){ $('#toastText').textContent=msg; $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2600); }

/* ---- 導航 / 渲染 ---- */
const TITLES={dashboard:['儀表板','你的 KOL 關係全貌與今日聯繫優先序'],directory:['KOL 名錄','管理你的關鍵意見領袖與互動歷程']};
function switchView(v){
  curView=v;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.nav===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  $('#view-'+v).classList.add('active');
  $('#pageTitle').textContent=TITLES[v][0];
  $('#pageSub').textContent=TITLES[v][1];
  $('#sidebar').classList.remove('open');
  render();
}
function render(){ if(curView==='dashboard')renderDashboard(); else renderDirectory(); }

/* ---- 事件 ---- */
document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>switchView(n.dataset.nav));
$('#addBtn').onclick=()=>openModal(DATA[0].id);
$('#mCancel').onclick=closeModal;
$('#mSave').onclick=saveInteraction;
$('#modalScrim').onclick=e=>{if(e.target===$('#modalScrim'))closeModal();};
$('#mAtt').onclick=e=>{const b=e.target.closest('.att-opt'); if(b)setAtt(b.dataset.sel);};
$('#scrim').onclick=closeDrawer;
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#searchInput').oninput=e=>{curSearch=e.target.value; if(curView!=='directory')switchView('directory'); else renderDirectory();};
$('#resetBtn').onclick=()=>{ if(confirm('重設為示範資料？目前的變更將被清除。')){ localStorage.removeItem('kolync'); DATA=load(); render(); toast('已重設為示範資料'); } };

document.addEventListener('click',e=>{
  const card=e.target.closest('[data-kol]');
  if(card && !e.target.closest('.att-opt') && !e.target.closest('.modal')){ openDrawer(card.dataset.kol); }
  const chip=e.target.closest('.chip');
  if(chip){ curFilter=chip.dataset.f; renderDirectory(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeModal();closeDrawer();} });

// topbar shadow on scroll
$('.content').addEventListener('scroll',()=>{});
window.addEventListener('scroll',()=>{ $('#topbar').classList.toggle('scrolled',window.scrollY>8); });

// init
render();
</script>
